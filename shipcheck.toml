# Checks run natively on this machine in an OS sandbox, each in its own clone of the tree
# (https://shipcheck.run/docs/config/#modes). The macOS entry of ci.yml's test matrix, the Linux entries stay on GitHub
runner = "host"

[host]
versions = ["cargo --version", "rustc --version"]

[host.checks]
test = "cargo fmt --check && cargo clippy --all-targets -- -D warnings && GIT_COW_EXPECT_CLONE=1 cargo test"
